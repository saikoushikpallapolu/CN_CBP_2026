services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TRAFFICSCAN_API_KEY: ${TRAFFICSCAN_API_KEY:?Set TRAFFICSCAN_API_KEY}
      TRAFFICSCAN_MAX_UPLOAD_MB: "64"
      TORCH_THREADS: "2"
      TRAFFICSCAN_REQUIRE_READY: "1"
    volumes:
      - ../ml/checkpoints:/app/ml/checkpoints:ro
      - ../data/production:/app/data/production
      - ../data/external:/app/data/external:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 4
